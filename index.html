<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#c9a84c;--gold2:#e8c97a;--gold3:#f5dfa0;
  --dark:#06100a;--dark2:#0c1a10;
  --green:#1e3d28;--green2:#2d5a3d;
}
body{font-family:'Montserrat',sans-serif;background:var(--dark);color:#fff;overflow-x:hidden;min-height:100vh;}

/* ── LANG BAR ── */
.lang-bar{position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(6,16,10,0.97);display:flex;justify-content:flex-end;align-items:center;padding:6px 14px;gap:4px;border-bottom:1px solid rgba(201,168,76,0.15);backdrop-filter:blur(8px);}
.lang-btn{padding:4px 12px;border-radius:20px;border:1px solid rgba(201,168,76,0.3);background:transparent;color:rgba(255,255,255,0.45);font-family:'Montserrat',sans-serif;font-size:10px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all 0.2s;}
.lang-btn.active{background:var(--gold);color:#000;border-color:var(--gold);}
.lang-btn:hover:not(.active){color:var(--gold2);border-color:var(--gold);}

/* ── HERO ── */
.hero{position:relative;min-height:480px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:60px 20px 70px;margin-top:30px;}
.hero-bg{position:absolute;inset:0;background:url('/mnt/user-data/uploads/hotel-belle-vue-skikda-bar-de-plage.webp') center/cover no-repeat;filter:brightness(0.28) saturate(1.3);}
.hero-overlay{position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 30%,rgba(201,168,76,0.07) 0%,transparent 70%),linear-gradient(to bottom,rgba(6,16,10,0.1) 0%,rgba(6,16,10,0.93) 100%);}
.gold-bar{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);}
.hero-content{position:relative;z-index:2;width:100%;}
.logos-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.logo-main{width:170px;filter:drop-shadow(0 4px 20px rgba(201,168,76,0.3));}
.logo-side{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 2px 10px rgba(0,0,0,0.5));border-radius:50%;background:rgba(255,255,255,0.07);padding:4px;}
.logo-divider{width:1px;height:50px;background:rgba(201,168,76,0.2);}
.welcome-ar{font-family:'Amiri',serif;font-size:18px;color:var(--gold2);direction:rtl;margin-bottom:4px;}
.welcome-fr{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:rgba(255,255,255,0.6);margin-bottom:4px;}
.welcome-en{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.3);margin-bottom:16px;text-transform:uppercase;}
.stars{color:var(--gold);letter-spacing:4px;font-size:12px;margin-bottom:18px;}
.beach-banner{background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.04));border:1px solid rgba(201,168,76,0.25);border-radius:14px;padding:12px 16px;max-width:340px;margin:0 auto;display:flex;align-items:center;gap:10px;}
.beach-txt strong{font-size:10px;color:var(--gold);letter-spacing:1.5px;display:block;margin-bottom:3px;}
.beach-txt small{font-size:9px;color:rgba(255,255,255,0.4);line-height:1.5;display:block;}
.beach-logos{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.beach-logo-sm{width:28px;height:28px;object-fit:contain;filter:brightness(1.3);}
.wave-div{position:absolute;bottom:0;left:0;right:0;height:45px;overflow:hidden;}
.wave-div svg{display:block;width:100%;height:100%;}

/* ── TOP NAV (Restaurant / Pizzeria) ── */
.top-nav{position:sticky;top:30px;z-index:101;background:rgba(6,16,10,0.98);backdrop-filter:blur(10px);border-bottom:2px solid rgba(201,168,76,0.3);display:flex;}
.top-btn{flex:1;padding:16px 10px;background:none;border:none;color:rgba(255,255,255,0.4);font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all 0.25s;text-transform:uppercase;border-bottom:3px solid transparent;position:relative;top:2px;display:flex;align-items:center;justify-content:center;gap:8px;}
.top-btn.active{color:var(--gold2);border-bottom-color:var(--gold);background:rgba(201,168,76,0.05);}
.top-btn:hover:not(.active){color:rgba(201,168,76,0.6);}
.top-btn-icon{font-size:18px;}

/* ── SUB NAV ── */
.sub-nav{position:sticky;top:82px;z-index:100;background:rgba(6,16,10,0.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(201,168,76,0.12);display:flex;overflow-x:auto;scrollbar-width:none;}
.sub-nav::-webkit-scrollbar{display:none}
.sub-btn{flex-shrink:0;padding:11px 14px;background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,0.32);font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:1.5px;cursor:pointer;transition:all 0.2s;white-space:nowrap;position:relative;top:1px;text-transform:uppercase;}
.sub-btn.active{color:var(--gold2);border-bottom-color:var(--gold);}

/* ── PANELS ── */
.panel{display:none;}.panel.active{display:block;}

/* ── SECTION ── */
.section{display:none;padding:28px 18px 44px;}.section.active{display:block;}

/* ── SEC HEADER ── */
.sec-header{text-align:center;margin-bottom:28px;}
.sec-icon{font-size:30px;margin-bottom:8px;}
.sec-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;color:var(--gold2);margin-bottom:4px;}
.sec-title-ar{font-family:'Amiri',serif;font-size:32px;color:var(--gold2);margin-bottom:4px;}
.sec-sub{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.28);margin-bottom:12px;text-transform:uppercase;}
.sec-line{display:flex;align-items:center;gap:8px;max-width:180px;margin:0 auto;}
.sl{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--gold));}
.sl.r{background:linear-gradient(to left,transparent,var(--gold));}
.sd{width:6px;height:6px;border-radius:50%;background:var(--gold);}

/* ── CATEGORY ── */
.cat-row{display:flex;align-items:center;gap:10px;margin:24px 0 14px;}
.cat-label{font-size:10px;letter-spacing:2.5px;font-weight:700;color:var(--gold);text-transform:uppercase;white-space:nowrap;}
.cat-rule{flex:1;height:1px;background:rgba(201,168,76,0.12);}

/* ── MENU ITEMS — bigger font ── */
.mitem{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06);gap:14px;}
.mitem:last-child{border-bottom:none;}
.mname{font-size:15px;font-weight:700;color:#fff;letter-spacing:0.3px;line-height:1.3;}
.mdesc{font-size:11px;color:rgba(255,255,255,0.32);margin-top:4px;font-style:italic;line-height:1.5;}
.mprice{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:var(--gold2);white-space:nowrap;flex-shrink:0;}

/* ── PRESTIGE ITEMS — bigger font ── */
.pitem{display:flex;align-items:flex-start;justify-content:space-between;padding:15px 0;border-bottom:1px solid rgba(255,255,255,0.06);gap:14px;}
.pitem:last-child{border-bottom:none;}
.pname{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;color:rgba(255,255,255,0.9);}
.pprice{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;color:var(--gold2);white-space:nowrap;flex-shrink:0;}

/* ── PACK CARD ── */
.pack-card{border:1px solid rgba(201,168,76,0.22);border-radius:14px;padding:20px;margin:12px 0;background:linear-gradient(135deg,rgba(45,90,61,0.2),rgba(6,16,10,0.55));position:relative;overflow:hidden;}
.pack-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.ptitle{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--gold2);margin-bottom:8px;}
.pdetails{font-size:13px;color:rgba(255,255,255,0.45);line-height:1.8;}
.pbig{font-family:'Cormorant Garamond',serif;font-size:26px;color:#fff;font-weight:700;margin-top:12px;}
.pbig span{font-size:11px;color:var(--gold);font-family:'Montserrat',sans-serif;}

/* ── ICE CARD ── */
.ice{border:1px solid rgba(120,190,255,0.12);border-radius:12px;padding:15px;margin:10px 0;background:linear-gradient(135deg,rgba(20,50,90,0.22),rgba(6,16,10,0.55));}
.iname{font-family:'Cormorant Garamond',serif;font-size:17px;color:#a8d8ff;margin-bottom:4px;}
.idesc{font-size:11px;color:rgba(255,255,255,0.3);font-style:italic;}
.iprice{font-family:'Cormorant Garamond',serif;font-size:18px;color:#a8d8ff;font-weight:700;margin-top:8px;}

/* ── DRINKS GRID ── */
.bois-grid{display:grid;grid-template-columns:1fr 1fr;}
.bitem{padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.bitem:nth-child(odd){padding-right:12px;border-right:1px solid rgba(255,255,255,0.05);}
.bitem:nth-child(even){padding-left:12px;}
.bname{font-size:12px;color:rgba(255,255,255,0.65);}
.bprice{font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--gold);margin-top:2px;}

/* ── BRAND BADGE ── */
.brand-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.18);border-radius:30px;padding:7px 16px;margin:0 auto 22px;}
.brand-badge img{width:24px;height:24px;object-fit:contain;}
.brand-badge span{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:600;}

/* ── FOOTER ── */
.footer{text-align:center;padding:30px 18px 50px;border-top:1px solid rgba(201,168,76,0.12);}
.footer-photo{width:100%;max-height:150px;object-fit:cover;object-position:center 35%;border-radius:14px;margin-bottom:20px;filter:brightness(0.55) saturate(1.1);}
.footer-logos{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;}
.footer-logo-main{width:130px;opacity:0.75;}
.footer-logo-side{width:46px;height:46px;object-fit:contain;opacity:0.5;}
.footer-closing{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--gold2);margin-bottom:5px;}
.footer-closing-ar{font-family:'Amiri',serif;font-size:19px;color:var(--gold2);direction:rtl;margin-bottom:5px;}
.footer-sub{font-size:10px;color:rgba(255,255,255,0.22);letter-spacing:1px;margin-bottom:12px;}
.gold-dots{color:var(--gold);letter-spacing:8px;font-size:10px;margin:12px 0;}
.footer-info{font-size:9px;color:rgba(255,255,255,0.18);letter-spacing:1.2px;line-height:2.2;text-transform:uppercase;}
.contact-info{font-size:11px;color:rgba(201,168,76,0.5);margin-top:10px;line-height:2;}

let lang='fr', panel='restaurant', secIdx=0;

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function buildSections(secs, containerId) {
  const d = D[lang];
  let html = '';
  secs.forEach((s, si) => {
    const titleEl = s.ar
      ? `<div class="sec-title-ar">${s.title}</div>`
      : `<div class="sec-title">${s.title}</div>`;
    let inner = `<div class="sec-header"><div class="sec-icon">${s.icon}</div>${titleEl}`;
    if(s.sub) inner += `<div class="sec-sub">${s.sub}</div>`;
    inner += `<div class="sec-line"><div class="sl"></div><div class="sd"></div><div class="sl r"></div></div></div>`;

    if(s.brand) inner += `<div class="brand-badge"><img src="/mnt/user-data/uploads/642b3120-53e9-43d6-a92e-b2af2b7a29d8-removebg-preview.png" style="width:24px;height:24px;object-fit:contain;" onerror="this.style.display='none'"><span>PIZZERIA BELLE VUE</span></div>`;

    if(s.type === 'packs') {
      s.packs.forEach(p => {
        const sp = p.special ? 'background:linear-gradient(135deg,rgba(100,60,10,0.25),rgba(6,16,10,0.6));border-color:rgba(201,168,76,0.3);' : '';
        const pc = p.special ? 'color:var(--gold2);' : '';
        inner += `<div class="pack-card" style="${sp}"><div class="ptitle" style="${pc}">${p.title}</div><div class="pdetails">${p.details.replace('\n','<br>')}</div><div class="pbig" style="${pc}">${p.price} <span>/ pack</span></div></div>`;
      });
    } else {
      (s.cats||[]).forEach(cat => {
        if(cat.label) {
          const cr = d.dir==='rtl' ? 'style="flex-direction:row-reverse;"' : '';
          inner += `<div class="cat-row" ${cr}><div class="cat-rule"></div><div class="cat-label">${cat.label}</div><div class="cat-rule"></div></div>`;
        }
        if(cat.type==='grid') {
          inner += `<div class="bois-grid">`;
          cat.items.forEach(it => inner += `<div class="bitem"><div class="bname">${it.n}</div><div class="bprice">${it.p}</div></div>`);
          inner += `</div>`;
        } else if(cat.type==='ice') {
          cat.items.forEach(it => inner += `<div class="ice"><div class="iname">${it.n}</div>${it.d?`<div class="idesc">${it.d}</div>`:''}<div class="iprice">${it.p}</div></div>`);
        } else if(s.type==='prestige') {
          cat.items.forEach(it => inner += `<div class="pitem"><div class="pname">${it.n}</div><div class="pprice">${it.p}</div></div>`);
        } else {
          cat.items.forEach(it => inner += `<div class="mitem"><div><div class="mname">${it.n}</div>${it.d?`<div class="mdesc">${it.d}</div>`:''}</div><div class="mprice">${it.p}</div></div>`);
        }
      });
    }
    html += `<div class="section${si===0?' active':''}">${inner}</div>`;
  });
  document.getElementById(containerId).innerHTML = html;
}

function buildSubNav(secs) {
  const nav = document.getElementById('sub-nav');
  nav.innerHTML = secs.map((s,i) =>
    `<button class="sub-btn${i===0?' active':''}" onclick="showSec(${i})">${s.icon} ${s.title}</button>`
  ).join('');
  secIdx = 0;
}

function render() {
  const d = D[lang];
  document.documentElement.setAttribute('dir', d.dir);
  document.body.style.direction = d.dir;
  document.getElementById('hero-welcome').innerHTML = d.welcome;
  document.getElementById('beach-title').textContent = d.beach_title;
  document.getElementById('beach-sub').textContent = d.beach_sub;
  document.getElementById('footer-closing').innerHTML = d.footer;
  document.getElementById('lbl-restaurant').textContent = d.panel_labels[0];
  document.getElementById('lbl-pizzeria').textContent = d.panel_labels[1];
  buildSections(d.restaurant, 'secs-restaurant');
  buildSections(d.pizzeria, 'secs-pizzeria');
  buildSubNav(d[panel]);
  // activate correct panel
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+panel).classList.add('active');
  document.getElementById('btn-restaurant').classList.toggle('active', panel==='restaurant');
  document.getElementById('btn-pizzeria').classList.toggle('active', panel==='pizzeria');
}

function switchPanel(p) {
  panel = p;
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));
  document.getElementById('panel-'+p).classList.add('active');
  document.getElementById('btn-restaurant').classList.toggle('active', p==='restaurant');
  document.getElementById('btn-pizzeria').classList.toggle('active', p==='pizzeria');
  buildSubNav(D[lang][p]);
  window.scrollTo({top:120,behavior:'smooth'});
}

function showSec(i) {
  secIdx = i;
  const secs = document.querySelectorAll('#panel-'+panel+' .section');
  secs.forEach((s,si) => s.classList.toggle('active', si===i));
  document.querySelectorAll('.sub-btn').forEach((b,bi) => b.classList.toggle('active', bi===i));
  window.scrollTo({top:120,behavior:'smooth'});
}

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`).classList.add('active');
  render();
}

render();
</script>
</body>
</html>
