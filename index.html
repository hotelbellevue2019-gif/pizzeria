<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#c9a84c;--gold2:#e8c97a;
  --dark:#0a0a14;--dark2:#10101e;
  --accent:#1a1a3e;
}
body{font-family:'Montserrat',sans-serif;background:var(--dark);color:#fff;overflow-x:hidden;min-height:100vh;}

/* ══ LANG BAR ══ */
.lang-bar{
  position:fixed;top:0;left:0;right:0;z-index:999;
  background:rgba(10,10,20,0.97);
  display:flex;justify-content:flex-end;align-items:center;
  padding:6px 14px;gap:6px;
  border-bottom:1px solid rgba(201,168,76,0.2);
  backdrop-filter:blur(10px);
}
.lang-btn{
  padding:5px 14px;border-radius:20px;
  border:1px solid rgba(201,168,76,0.35);
  background:transparent;color:rgba(255,255,255,0.4);
  font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:1px;cursor:pointer;transition:all 0.2s;
}
.lang-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border-color:transparent;}
.lang-btn:hover:not(.active){color:var(--gold2);border-color:var(--gold);}

/* ══ HERO ══ */
.hero{
  position:relative;min-height:500px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;padding:60px 20px 80px;margin-top:30px;
}
.hero-bg{
  position:absolute;inset:0;
  background:url('https://dynamic-media-cdn.tripadvisor.com/media/photo-o/1d/1f/e8/99/caption.jpg?w=900&h=-1&s=1') center/cover no-repeat;
  filter:brightness(0.22) saturate(0.8) hue-rotate(200deg);
}
.hero-overlay{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 90% 60% at 50% 20%, rgba(100,120,255,0.08) 0%, transparent 65%),
    linear-gradient(to bottom, rgba(10,10,20,0.1) 0%, rgba(10,10,20,0.95) 100%);
}
.gold-bar-top{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--gold2),var(--gold),transparent);}
.hero-content{position:relative;z-index:2;width:100%;}

.logos-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.logo-main{width:180px;filter:drop-shadow(0 4px 24px rgba(201,168,76,0.25));}
.logo-side{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 2px 12px rgba(0,0,0,0.6));background:rgba(255,255,255,0.06);border-radius:50%;padding:5px;}
.logo-div{width:1px;height:52px;background:rgba(201,168,76,0.18);}
.stars{color:var(--gold);letter-spacing:5px;font-size:11px;margin-bottom:16px;}

.welcome-line{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:rgba(255,255,255,0.55);margin-bottom:3px;}
.welcome-ar-line{font-family:'Amiri',serif;font-size:18px;color:var(--gold2);direction:rtl;margin-bottom:3px;}
.location-line{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,0.25);margin-bottom:18px;text-transform:uppercase;}

.beach-banner{
  background:linear-gradient(135deg,rgba(100,120,255,0.08),rgba(201,168,76,0.06));
  border:1px solid rgba(201,168,76,0.2);border-radius:14px;
  padding:12px 16px;max-width:340px;margin:0 auto;
  display:flex;align-items:center;gap:10px;
}
.beach-txt strong{font-size:9px;color:var(--gold);letter-spacing:1.5px;display:block;margin-bottom:3px;font-weight:700;}
.beach-txt small{font-size:9px;color:rgba(255,255,255,0.35);line-height:1.5;display:block;}
.beach-logos{display:flex;gap:5px;align-items:center;flex-shrink:0;}
.beach-logo-sm{width:28px;height:28px;object-fit:contain;}

.wave-div{position:absolute;bottom:0;left:0;right:0;height:45px;overflow:hidden;}
.wave-div svg{display:block;width:100%;height:100%;}

/* ══ NAV ══ */
.nav{
  position:sticky;top:30px;z-index:100;
  background:rgba(10,10,20,0.97);
  border-bottom:1px solid rgba(201,168,76,0.15);
  display:flex;overflow-x:auto;scrollbar-width:none;
  backdrop-filter:blur(10px);
}
.nav::-webkit-scrollbar{display:none}
.nav-btn{
  flex-shrink:0;padding:13px 13px;
  background:none;border:none;border-bottom:2px solid transparent;
  color:rgba(255,255,255,0.35);
  font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:1.2px;
  cursor:pointer;transition:all 0.2s;white-space:nowrap;
  position:relative;top:1px;text-transform:uppercase;
}
.nav-btn.active{color:var(--gold2);border-bottom-color:var(--gold);}

/* ══ SECTIONS ══ */
.section{display:none;padding:26px 18px 40px;}
.section.active{display:block;}
.sec-header{text-align:center;margin-bottom:26px;}
.sec-icon{font-size:26px;margin-bottom:6px;}
.sec-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--gold2);margin-bottom:3px;}
.sec-title-ar{font-family:'Amiri',serif;font-size:28px;color:var(--gold2);margin-bottom:3px;}
.sec-sub{font-size:9px;letter-spacing:2px;color:rgba(255,255,255,0.25);margin-bottom:10px;}
.sec-line{display:flex;align-items:center;gap:8px;max-width:160px;margin:0 auto;}
.sl{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--gold));}
.sl.r{background:linear-gradient(to left,transparent,var(--gold));}
.sd{width:5px;height:5px;border-radius:50%;background:var(--gold);}

.brand-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(201,168,76,0.15);border-radius:30px;padding:6px 14px;margin:0 auto 20px;}
.brand-badge img{width:22px;height:22px;object-fit:contain;}
.brand-badge span{font-size:9px;letter-spacing:2px;color:var(--gold);font-weight:600;}

.cat-row{display:flex;align-items:center;gap:10px;margin:20px 0 12px;}
.cat-label{font-size:9px;letter-spacing:2px;font-weight:700;color:var(--gold);text-transform:uppercase;white-space:nowrap;}
.cat-rule{flex:1;height:1px;background:rgba(201,168,76,0.1);}

.mitem{display:flex;align-items:flex-start;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.05);gap:12px;}
.mitem:last-child{border-bottom:none;}
.mname{font-size:12px;font-weight:600;color:#fff;line-height:1.3;}
.mdesc{font-size:10px;color:rgba(255,255,255,0.28);margin-top:3px;font-style:italic;line-height:1.4;}
.mprice{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:var(--gold2);white-space:nowrap;flex-shrink:0;}

.pitem{display:flex;align-items:flex-start;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(255,255,255,0.05);gap:12px;}
.pitem:last-child{border-bottom:none;}
.pname{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;color:rgba(255,255,255,0.88);}
.pprice{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;color:var(--gold2);white-space:nowrap;flex-shrink:0;}

.pack-card{border:1px solid rgba(201,168,76,0.18);border-radius:14px;padding:18px;margin:10px 0;background:linear-gradient(135deg,rgba(40,50,100,0.2),rgba(10,10,20,0.5));position:relative;overflow:hidden;}
.pack-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.ptitle{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:var(--gold2);margin-bottom:6px;}
.pdetails{font-size:11px;color:rgba(255,255,255,0.4);line-height:1.7;}
.pbig{font-family:'Cormorant Garamond',serif;font-size:24px;color:#fff;font-weight:700;margin-top:10px;}
.pbig span{font-size:10px;color:var(--gold);font-family:'Montserrat',sans-serif;}

.ice{border:1px solid rgba(100,170,255,0.1);border-radius:12px;padding:14px;margin:8px 0;background:linear-gradient(135deg,rgba(20,40,100,0.2),rgba(10,10,20,0.5));}
.iname{font-family:'Cormorant Garamond',serif;font-size:15px;color:#a8d4ff;margin-bottom:3px;}
.idesc{font-size:10px;color:rgba(255,255,255,0.28);font-style:italic;}
.iprice{font-family:'Cormorant Garamond',serif;font-size:16px;color:#a8d4ff;font-weight:700;margin-top:6px;}

.bois-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.bitem{padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.bitem:nth-child(odd){padding-right:10px;border-right:1px solid rgba(255,255,255,0.04);}
.bitem:nth-child(even){padding-left:10px;}
.bname{font-size:10px;color:rgba(255,255,255,0.6);}
.bprice{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--gold);margin-top:1px;}

/* ══ FOOTER ══ */
.footer{text-align:center;padding:30px 18px 50px;border-top:1px solid rgba(201,168,76,0.1);}
.footer-logos{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;}
.footer-logo-main{width:120px;opacity:0.7;}
.footer-logo-side{width:42px;height:42px;object-fit:contain;opacity:0.45;}
.footer-closing{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--gold2);margin-bottom:4px;}
.footer-closing-ar{font-family:'Amiri',serif;font-size:18px;color:var(--gold2);direction:rtl;margin-bottom:4px;}
.footer-sub{font-size:9px;color:rgba(255,255,255,0.25);letter-spacing:1px;margin-bottom:12px;}
.gold-dots{color:var(--gold);letter-spacing:8px;font-size:9px;margin:12px 0;}
.footer-info{font-size:9px;color:rgba(255,255,255,0.18);letter-spacing:1.2px;line-height:2.2;text-transform:uppercase;}
.contact-info{font-size:10px;color:rgba(201,168,76,0.45);margin-top:8px;line-height:1.8;}

/* RTL */
.rtl{direction:rtl;}
.rtl .cat-row{flex-direction:row-reverse;}
.rtl .sl{background:linear-gradient(to left,transparent,var(--gold));}
.rtl .sl.r{background:linear-gradient(to right,transparent,var(--gold));}
.rtl .bitem:nth-child(odd){padding-right:0;padding-left:10px;border-right:none;border-left:1px solid rgba(255,255,255,0.04);}
.rtl .bitem:nth-child(even){padding-left:0;padding-right:10px;}

</head>

// ══════════════════════════════════════════
// RENDER ENGINE
// ══════════════════════════════════════════
let currentLang = 'fr';
let currentSection = 0;

function renderAll(lang) {
  const d = T[lang];
  document.documentElement.setAttribute('dir', d.dir);
  document.body.style.direction = d.dir;

  // Hero
  document.getElementById('hero-welcome').innerHTML = d.welcome;
  document.getElementById('beach-title').textContent = d.beach_title;
  document.getElementById('beach-sub').textContent = d.beach_sub;
  document.getElementById('footer-closing').innerHTML = d.footer;

  // Nav
  const nav = document.getElementById('main-nav');
  nav.innerHTML = d.nav.map((label,i) =>
    `<button class="nav-btn${i===currentSection?' active':''}" onclick="showSection(${i})">${label}</button>`
  ).join('');

  // Sections
  const container = document.getElementById('sections-container');
  container.innerHTML = d.sections.map((sec, si) => {
    let inner = '';

    // Title
    const titleHtml = sec.titleAr
      ? `<div class="sec-title-ar">${sec.title}</div>`
      : `<div class="sec-title">${sec.title}</div>`;

    inner += `<div class="sec-header"><div class="sec-icon">${sec.icon}</div>${titleHtml}`;
    if(sec.sub) inner += `<div class="sec-sub">${sec.sub}</div>`;
    inner += `<div class="sec-line"><div class="sl"></div><div class="sd"></div><div class="sl r"></div></div></div>`;

    if(sec.brand) {
      inner += `<div class="brand-badge" style="display:inline-flex;">
        <img src="/mnt/user-data/uploads/642b3120-53e9-43d6-a92e-b2af2b7a29d8-removebg-preview.png" style="width:22px;height:22px;object-fit:contain;" onerror="this.style.display='none'">
        <span>PIZZERIA BELLE VUE</span></div>`;
    }

    if(sec.type === 'packs') {
      sec.packs.forEach(p => {
        const sp = p.special ? 'background:linear-gradient(135deg,rgba(100,80,10,0.22),rgba(10,10,20,0.5));border-color:rgba(201,168,76,0.28);' : '';
        const pc = p.special ? 'color:var(--gold2);' : '';
        inner += `<div class="pack-card" style="${sp}">
          <div class="ptitle" style="${pc}">${p.title}</div>
          <div class="pdetails">${p.details.replace('\n','<br>')}</div>
          <div class="pbig" style="${pc}">${p.price} <span>/ pack</span></div>
        </div>`;
      });
    } else {
      sec.cats.forEach(cat => {
        if(cat.label) {
          inner += `<div class="cat-row"><div class="cat-rule"></div><div class="cat-label">${cat.label}</div><div class="cat-rule"></div></div>`;
        }
        if(cat.type === 'grid') {
          inner += `<div class="bois-grid">`;
          cat.items.forEach(it => {
            inner += `<div class="bitem"><div class="bname">${it.n}</div><div class="bprice">${it.p}</div></div>`;
          });
          inner += `</div>`;
        } else if(cat.type === 'ice') {
          cat.items.forEach(it => {
            inner += `<div class="ice"><div class="iname">${it.n}</div>`;
            if(it.d) inner += `<div class="idesc">${it.d}</div>`;
            inner += `<div class="iprice">${it.p}</div></div>`;
          });
        } else if(sec.type === 'prestige') {
          cat.items.forEach(it => {
            inner += `<div class="pitem"><div class="pname">${it.n}</div><div class="pprice">${it.p}</div></div>`;
          });
        } else {
          cat.items.forEach(it => {
            inner += `<div class="mitem"><div><div class="mname">${it.n}</div>`;
            if(it.d) inner += `<div class="mdesc">${it.d}</div>`;
            inner += `</div><div class="mprice">${it.p}</div></div>`;
          });
        }
      });
    }

    return `<div class="section${si===currentSection?' active':''}" id="sec_${lang}_${si}">${inner}</div>`;
  }).join('');

  // RTL class
  if(lang==='ar'){
    document.querySelectorAll('.cat-row').forEach(el=>el.classList.add('rtl'));
  }
}

function showSection(idx) {
  currentSection = idx;
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const secs = document.querySelectorAll('.section');
  if(secs[idx]) secs[idx].classList.add('active');
  const btns = document.querySelectorAll('#main-nav .nav-btn');
  if(btns[idx]) btns[idx].classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
  renderAll(lang);
}

// Init
renderAll('fr');
